<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lux - Overlay OBS</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.7/gsap.min.js"></script>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; }
    canvas { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); pointer-events: none; }
    /* Aviso de licencia (Riot Games): letra pequeña en el pie. Solo aparece si el personaje lo lleva. */
    #lux-license { position: fixed; left: 0; right: 0; bottom: 4px; margin: 0; padding: 0 12px; text-align: center; font: 10px/1.3 system-ui, sans-serif; color: rgba(255,255,255,0.72); text-shadow: 0 1px 2px rgba(0,0,0,0.85); pointer-events: none; display: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <canvas id="mascota-c" style="display:none"></canvas>
  <p id="lux-license" role="note"></p>
  <script>
    // =========================================================================
    // Lux · overlay de OBS (fuente de navegador, fondo transparente).
    // Parámetros: ?overlay=1&k=<clave OBS>&channel=<canal>&size=40&demo=<gesto>
    // Sin estudio, sin galería: solo el personaje, su voz, su chat y sus gestos.
    // =========================================================================

    const params = new URLSearchParams(location.search);
    const widgetKey = params.get('k') || '';
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ---------- 1. Expresiones (las diez de siempre) ----------
    const EXPRESSIONS = [
      { id: 'normal', leftEye: 'open', rightEye: 'open', mouth: 'smile', brows: 'neutral', blush: 0.45, sweat: false, angerVein: false, starEyes: false,
        pose: { thumbsUp: false, showStaff: true, staffGlow: false, headRot: [0.03, 0.08, -0.02], leftArmRot: [0.22, 0.1, 0.45], rightArmRot: [-0.32, -0.2, -0.40], leftElbow: -0.25, rightElbow: -0.30, bodyTilt: [0, -0.08, 0] } },
      { id: 'habla', leftEye: 'open', rightEye: 'open', mouth: 'talk', brows: 'talk', blush: 0.45, sweat: false, angerVein: false, starEyes: false,
        pose: { thumbsUp: false, showStaff: true, staffGlow: false, headRot: [-0.02, -0.1, 0.04], leftArmRot: [-0.55, 0.25, 0.65], rightArmRot: [-0.25, -0.15, -0.35], leftElbow: -0.55, rightElbow: -0.25, bodyTilt: [0, 0.06, 0] } },
      { id: 'emocionada', leftEye: 'big', rightEye: 'big', mouth: 'big_happy', brows: 'high', blush: 0.75, sweat: false, angerVein: false, starEyes: false,
        pose: { thumbsUp: true, showStaff: false, staffGlow: false, headRot: [-0.06, 0, -0.04], leftArmRot: [-0.85, 0.35, 0.55], rightArmRot: [-0.85, -0.35, -0.55], leftElbow: -0.45, rightElbow: -0.45, bodyTilt: [-0.04, 0, 0.02] } },
      { id: 'grita', leftEye: 'determined', rightEye: 'determined', mouth: 'scream', brows: 'angry', blush: 0.35, sweat: false, angerVein: false, starEyes: false,
        pose: { thumbsUp: false, showStaff: true, staffGlow: true, headRot: [-0.08, 0.12, 0], leftArmRot: [-0.7, 0.2, 0.95], rightArmRot: [-0.75, -0.2, -0.85], leftElbow: -0.35, rightElbow: -0.35, bodyTilt: [0.06, -0.1, 0] } },
      { id: 'feliz', leftEye: 'arc_happy', rightEye: 'arc_happy', mouth: 'sweet_smile', brows: 'high', blush: 0.8, sweat: false, angerVein: false, starEyes: false,
        pose: { thumbsUp: false, showStaff: true, staffGlow: false, headRot: [0.04, -0.08, 0.08], leftArmRot: [-0.3, 0.3, 0.35], rightArmRot: [-0.3, -0.2, -0.35], leftElbow: -0.45, rightElbow: -0.35, bodyTilt: [0, 0.05, 0.03] } },
      { id: 'alegre', leftEye: 'open', rightEye: 'wink', mouth: 'big_happy', brows: 'wink', blush: 0.7, sweat: false, angerVein: false, starEyes: false,
        pose: { thumbsUp: true, showStaff: false, staffGlow: false, headRot: [0.02, 0.12, -0.09], leftArmRot: [-0.8, 0.3, 0.5], rightArmRot: [-0.8, -0.3, -0.5], leftElbow: -0.4, rightElbow: -0.4, bodyTilt: [0, -0.08, -0.03] } },
      { id: 'triste', leftEye: 'sad_teary', rightEye: 'sad_teary', mouth: 'sad', brows: 'sad', blush: 0.3, sweat: false, angerVein: false, starEyes: false,
        pose: { thumbsUp: false, showStaff: true, staffGlow: false, headRot: [0.16, -0.06, -0.05], leftArmRot: [0.25, -0.15, 0.22], rightArmRot: [0.25, 0.15, -0.25], leftElbow: -0.35, rightElbow: -0.35, bodyTilt: [0.06, 0.04, 0] } },
      { id: 'molesta', leftEye: 'angry', rightEye: 'angry', mouth: 'pout', brows: 'angry', blush: 0.85, sweat: false, angerVein: true, starEyes: false,
        pose: { thumbsUp: false, showStaff: false, staffGlow: false, headRot: [0.08, -0.14, 0.05], leftArmRot: [-0.35, -0.4, 0.55], rightArmRot: [-0.35, 0.4, -0.55], leftElbow: -0.65, rightElbow: -0.65, bodyTilt: [-0.04, 0.12, 0] } },
      { id: 'sorprendida', leftEye: 'shock', rightEye: 'shock', mouth: 'o_mouth', brows: 'high', blush: 0.4, sweat: true, angerVein: false, starEyes: false,
        pose: { thumbsUp: false, showStaff: true, staffGlow: false, headRot: [-0.07, 0.05, -0.03], leftArmRot: [-0.6, 0.1, 0.75], rightArmRot: [-0.45, -0.1, -0.55], leftElbow: -0.5, rightElbow: -0.4, bodyTilt: [-0.05, -0.04, 0] } },
      { id: 'magica', leftEye: 'big', rightEye: 'big', mouth: 'big_happy', brows: 'high', blush: 0.85, sweat: false, angerVein: false, starEyes: true,
        pose: { thumbsUp: true, showStaff: true, staffGlow: true, headRot: [-0.05, -0.06, 0.06], leftArmRot: [-0.9, 0.35, 0.6], rightArmRot: [-0.9, -0.35, -0.6], leftElbow: -0.4, rightElbow: -0.4, bodyTilt: [-0.03, 0.05, 0.02] } }
    ];
    const IDS = EXPRESSIONS.map((e) => e.id);

    // ---------- 2. Rostro: textura 2D (una vez por expresión, en caché) ----------
    const faceCanvas = document.createElement('canvas');
    faceCanvas.width = 1024;
    faceCanvas.height = 1024;
    const fCtx = faceCanvas.getContext('2d');

    function drawStar(ctx, cx, cy, spikes, outerR, innerR, color) {
      ctx.save();
      ctx.beginPath();
      ctx.translate(cx, cy);
      ctx.moveTo(0, -outerR);
      for (let i = 0; i < spikes; i++) {
        ctx.rotate(Math.PI / spikes);
        ctx.lineTo(0, -innerR);
        ctx.rotate(Math.PI / spikes);
        ctx.lineTo(0, -outerR);
      }
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.shadowColor = '#fde047';
      ctx.shadowBlur = 15;
      ctx.fill();
      ctx.restore();
    }

    function drawEye(ctx, cx, cy, type, isRight, hasStar) {
      ctx.save();
      ctx.translate(cx, cy);
      if (isRight) ctx.scale(-1, 1);
      ctx.strokeStyle = '#3b1d14';
      ctx.lineCap = 'round';

      if (type === 'arc_happy') {
        ctx.lineWidth = 22;
        ctx.beginPath();
        ctx.moveTo(-78, 18);
        ctx.quadraticCurveTo(0, -68, 78, 12);
        ctx.stroke();
        ctx.restore();
        return;
      }
      if (type === 'wink' || type === 'blink_closed') {
        ctx.lineWidth = 22;
        ctx.beginPath();
        if (type === 'blink_closed') {
          ctx.moveTo(-78, 6);
          ctx.quadraticCurveTo(0, 26, 78, 6);
        } else {
          ctx.moveTo(-80, 12);
          ctx.quadraticCurveTo(0, -52, 78, 20);
        }
        ctx.stroke();
        ctx.restore();
        return;
      }

      const rx = type === 'big' ? 86 : type === 'shock' ? 84 : 80;
      const ry = type === 'big' ? 105 : type === 'shock' ? 104 : 96;

      ctx.fillStyle = 'rgba(180, 105, 78, 0.25)';
      ctx.beginPath();
      ctx.ellipse(0, -6, rx + 8, ry + 8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.beginPath();
      ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
      ctx.clip();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-rx - 10, -ry - 10, (rx + 10) * 2, (ry + 10) * 2);

      const irisScale = type === 'shock' ? 0.78 : 0.88;
      const irx = rx * irisScale;
      const iry = ry * irisScale;
      const irisGrad = ctx.createLinearGradient(0, -iry, 0, iry);
      irisGrad.addColorStop(0, '#0c2461');
      irisGrad.addColorStop(0.32, '#1e3799');
      irisGrad.addColorStop(0.68, '#0984e3');
      irisGrad.addColorStop(1, '#74b9ff');
      ctx.fillStyle = irisGrad;
      ctx.beginPath();
      ctx.ellipse(4, 6, irx, iry, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#081338';
      ctx.beginPath();
      ctx.ellipse(4, 8, irx * (type === 'shock' ? 0.34 : 0.46), iry * (type === 'shock' ? 0.34 : 0.46), 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(-26, -30, 24, 29, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(32, 34, 13, 0, Math.PI * 2);
      ctx.fill();

      if (hasStar) drawStar(ctx, 4, 10, 4, 38, 13, '#fef08a');

      if (type === 'sad_teary') {
        const tear = ctx.createLinearGradient(0, 45, 0, ry);
        tear.addColorStop(0, 'rgba(186, 230, 253, 0.3)');
        tear.addColorStop(1, 'rgba(56, 189, 248, 0.85)');
        ctx.fillStyle = tear;
        ctx.beginPath();
        ctx.ellipse(0, ry - 18, rx * 0.9, 28, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      if (type === 'angry' || type === 'determined') {
        ctx.fillStyle = '#fbd4c0';
        ctx.beginPath();
        ctx.moveTo(-rx - 20, -ry - 20);
        ctx.lineTo(rx + 20, -ry - 20);
        ctx.lineTo(rx + 20, 8);
        ctx.lineTo(-rx - 20, -45);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      ctx.lineWidth = 24;
      ctx.beginPath();
      if (type === 'angry' || type === 'determined') {
        ctx.moveTo(-rx - 10, -38);
        ctx.quadraticCurveTo(0, -28, rx + 8, 10);
      } else if (type === 'sad_teary') {
        ctx.moveTo(-rx - 10, 10);
        ctx.quadraticCurveTo(0, -ry - 4, rx + 8, -24);
      } else {
        ctx.arc(0, 6, rx + 3, Math.PI * 1.12, Math.PI * 1.88);
      }
      ctx.stroke();
      ctx.restore();
    }

    function paintFace(expr, blink) {
      const W = faceCanvas.width;
      fCtx.clearRect(0, 0, W, W);

      const blush = expr.blush || 0.5;
      const drawBlush = (bx, by) => {
        const g = fCtx.createRadialGradient(bx, by, 6, bx, by, 92);
        g.addColorStop(0, `rgba(251, 113, 133, ${Math.min(0.95, blush + 0.15)})`);
        g.addColorStop(0.6, `rgba(251, 113, 133, ${blush * 0.55})`);
        g.addColorStop(1, 'rgba(251, 113, 133, 0)');
        fCtx.fillStyle = g;
        fCtx.beginPath();
        fCtx.ellipse(bx, by, 92, 54, 0, 0, Math.PI * 2);
        fCtx.fill();
      };
      drawBlush(235, 590);
      drawBlush(789, 590);

      drawEye(fCtx, 298, 455, blink ? 'blink_closed' : expr.leftEye, false, expr.starEyes);
      drawEye(fCtx, 726, 455, blink ? 'blink_closed' : expr.rightEye, true, expr.starEyes);

      const brow = (bx, by, isRight) => {
        fCtx.save();
        fCtx.translate(bx, by);
        if (isRight) fCtx.scale(-1, 1);
        fCtx.strokeStyle = '#85420e';
        fCtx.lineWidth = 18;
        fCtx.lineCap = 'round';
        fCtx.beginPath();
        const b = expr.brows;
        if (b === 'angry') { fCtx.moveTo(-74, -16); fCtx.quadraticCurveTo(0, 8, 70, 38); }
        else if (b === 'sad') { fCtx.moveTo(-74, 28); fCtx.quadraticCurveTo(0, 6, 70, -18); }
        else if (b === 'high') { fCtx.moveTo(-74, -8); fCtx.quadraticCurveTo(0, -46, 72, -6); }
        else if (b === 'talk') { const o = isRight ? -18 : 0; fCtx.moveTo(-74, 4 + o); fCtx.quadraticCurveTo(0, -30 + o, 72, 4 + o); }
        else if (b === 'wink') { const o = isRight ? 12 : -8; fCtx.moveTo(-74, 4 + o); fCtx.quadraticCurveTo(0, -28 + o, 72, 6 + o); }
        else { fCtx.moveTo(-74, 6); fCtx.quadraticCurveTo(0, -28, 72, 8); }
        fCtx.stroke();
        fCtx.restore();
      };
      brow(298, 285, false);
      brow(726, 285, true);

      fCtx.save();
      fCtx.translate(512, 695);
      const m = expr.mouth;
      if (m === 'smile' || m === 'sad' || m === 'sweet_smile' || m === 'pout') {
        fCtx.strokeStyle = m === 'sad' || m === 'pout' ? '#8c2323' : '#9e3324';
        fCtx.lineWidth = m === 'sweet_smile' ? 14 : 13;
        fCtx.lineCap = 'round';
        fCtx.beginPath();
        if (m === 'sad') { fCtx.moveTo(-50, 22); fCtx.quadraticCurveTo(0, -16, 50, 22); }
        else if (m === 'pout') { fCtx.moveTo(-44, 12); fCtx.quadraticCurveTo(-15, -10, 0, 8); fCtx.quadraticCurveTo(15, -10, 44, 12); }
        else if (m === 'sweet_smile') { fCtx.moveTo(-60, -12); fCtx.quadraticCurveTo(0, 36, 60, -12); }
        else { fCtx.moveTo(-52, -8); fCtx.quadraticCurveTo(0, 28, 52, -8); }
        fCtx.stroke();
      } else if (m === 'big_happy' || m === 'talk' || m === 'scream') {
        const wide = m === 'scream' ? 82 : 105;
        fCtx.beginPath();
        fCtx.moveTo(-wide, -24);
        fCtx.quadraticCurveTo(0, -12, wide, -24);
        fCtx.bezierCurveTo(wide + 7, m === 'talk' ? 56 : 86, -wide - 7, m === 'talk' ? 56 : 86, -wide, -24);
        fCtx.closePath();
        fCtx.fillStyle = m === 'scream' ? '#731414' : '#992626';
        fCtx.fill();
        fCtx.save();
        fCtx.clip();
        fCtx.fillStyle = '#ff7676';
        fCtx.beginPath();
        fCtx.ellipse(0, 50, 70, 40, 0, 0, Math.PI * 2);
        fCtx.fill();
        fCtx.restore();
        fCtx.strokeStyle = '#731c1c';
        fCtx.lineWidth = 10;
        fCtx.stroke();
      } else if (m === 'o_mouth') {
        fCtx.fillStyle = '#8c2020';
        fCtx.beginPath();
        fCtx.ellipse(0, 8, 32, 40, 0, 0, Math.PI * 2);
        fCtx.fill();
      }
      fCtx.restore();

      if (expr.sweat) {
        fCtx.save();
        fCtx.translate(855, 325);
        fCtx.fillStyle = '#7dd3fc';
        fCtx.strokeStyle = '#0284c7';
        fCtx.lineWidth = 7;
        fCtx.beginPath();
        fCtx.moveTo(0, -46);
        fCtx.bezierCurveTo(34, 0, 38, 38, 0, 46);
        fCtx.bezierCurveTo(-38, 38, -34, 0, 0, -46);
        fCtx.fill();
        fCtx.stroke();
        fCtx.restore();
      }
      if (expr.angerVein) {
        fCtx.save();
        fCtx.translate(830, 265);
        fCtx.strokeStyle = '#ef4444';
        fCtx.lineWidth = 12;
        fCtx.lineCap = 'round';
        [0, Math.PI * 0.5, Math.PI, Math.PI * 1.5].forEach((rot) => {
          fCtx.save();
          fCtx.rotate(rot);
          fCtx.beginPath();
          fCtx.moveTo(-32, -11);
          fCtx.quadraticCurveTo(-11, -11, -11, -32);
          fCtx.stroke();
          fCtx.restore();
        });
        fCtx.restore();
      }
    }

    // ---------- 3. Escena, cámara y luces ----------
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(640, 640, false);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.setClearColor(0x000000, 0);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
    scene.add(new THREE.AmbientLight(0xfff5eb, 0.85));
    const keyLight = new THREE.DirectionalLight(0xfffbeb, 0.85);
    keyLight.position.set(3.5, 5.5, 5.5);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0x93c5fd, 0.45);
    fillLight.position.set(-4, 2, 3);
    scene.add(fillLight);
    const rimLight = new THREE.PointLight(0xfbbf24, 0.9, 10);
    rimLight.position.set(0, 3.2, -3.0);
    scene.add(rimLight);

    const faceTexture = new THREE.CanvasTexture(faceCanvas);
    faceTexture.encoding = THREE.sRGBEncoding;
    faceTexture.anisotropy = 4;

    const mats = {
      skin: new THREE.MeshStandardMaterial({ color: 0xfbd4c0, roughness: 0.62, metalness: 0.02 }),
      face: new THREE.MeshBasicMaterial({ map: faceTexture, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4 }),
      hairMain: new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.38, metalness: 0.12 }),
      hairLight: new THREE.MeshStandardMaterial({ color: 0xfbbf24, roughness: 0.32, metalness: 0.15 }),
      hairDeep: new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.45, metalness: 0.08 }),
      armorSilver: new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.28, metalness: 0.75 }),
      armorGold: new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.25, metalness: 0.82 }),
      clothNavy: new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.6, metalness: 0.1 }),
      skirtWhite: new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.5, metalness: 0.08, side: THREE.DoubleSide }),
      frillPink: new THREE.MeshStandardMaterial({ color: 0xfce7f3, roughness: 0.55, metalness: 0.05 }),
      gloveWhite: new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.5, metalness: 0.05 }),
      rubyGem: new THREE.MeshStandardMaterial({ color: 0xe11d48, emissive: 0x9f1239, emissiveIntensity: 0.5, roughness: 0.15, metalness: 0.3 }),
      magicOrb: new THREE.MeshStandardMaterial({ color: 0xfef08a, emissive: 0xfacc15, emissiveIntensity: 0.9, roughness: 0.1 })
    };

    // ---------- 4. Rig articulado (cabeza, torso, brazos con codo y muñeca, piernas con rodilla) ----------
    const luxRoot = new THREE.Group();
    scene.add(luxRoot);
    const bodyPivot = new THREE.Group();
    luxRoot.add(bodyPivot);

    const headPivot = new THREE.Group();
    headPivot.position.set(0, 1.32, 0);
    bodyPivot.add(headPivot);
    const headGeo = new THREE.SphereGeometry(0.82, 48, 36);
    headGeo.scale(1.06, 0.98, 1.0);
    headPivot.add(new THREE.Mesh(headGeo, mats.skin));
    const nose = new THREE.Mesh(new THREE.SphereGeometry(0.038, 16, 16), mats.skin);
    nose.position.set(0, -0.08, 0.835);
    headPivot.add(nose);
    const earGeo = new THREE.SphereGeometry(0.16, 20, 20);
    earGeo.scale(0.55, 1.0, 0.7);
    const leftEar = new THREE.Mesh(earGeo, mats.skin);
    leftEar.position.set(-0.86, -0.05, 0.05);
    headPivot.add(leftEar);
    const rightEar = new THREE.Mesh(earGeo, mats.skin);
    rightEar.position.set(0.86, -0.05, 0.05);
    headPivot.add(rightEar);

    // Plano de rostro curvado sobre la esfera
    const facePlaneGeo = new THREE.PlaneGeometry(1.18, 0.96, 40, 40);
    const fpa = facePlaneGeo.attributes.position;
    const rx = 0.82 * 1.06, ry = 0.82 * 0.98, rz = 0.82;
    for (let i = 0; i < fpa.count; i++) {
      const vx = fpa.getX(i), vy = fpa.getY(i);
      const term = Math.max(0.05, 1 - (vx * vx) / (rx * rx) - (vy * vy) / (ry * ry));
      fpa.setZ(i, rz * Math.sqrt(term) + 0.018);
    }
    facePlaneGeo.computeVertexNormals();
    const facePatch = new THREE.Mesh(facePlaneGeo, mats.face);
    facePatch.renderOrder = 2;
    headPivot.add(facePatch);

    // Cabello: cúpula, flequillos y mechones traseros con pivote propio
    const hairGroup = new THREE.Group();
    headPivot.add(hairGroup);
    const domeGeo = new THREE.SphereGeometry(0.89, 40, 40);
    domeGeo.scale(1.09, 1.02, 1.05);
    const dome = new THREE.Mesh(domeGeo, mats.hairMain);
    dome.position.set(0, 0.16, -0.14);
    hairGroup.add(dome);

    function hairStrand(points, radiusTop, radiusMid, mat) {
      const curve = new THREE.CatmullRomCurve3(points.map((p) => new THREE.Vector3(...p)));
      const seg = 28, radial = 14;
      const geo = new THREE.TubeGeometry(curve, seg, radiusMid, radial, false);
      const pos = geo.attributes.position;
      const c = new THREE.Vector3();
      for (let i = 0; i <= seg; i++) {
        const t = i / seg;
        curve.getPointAt(t, c);
        let s = (1 - t) * (radiusTop / radiusMid) + Math.sin(t * Math.PI) * 0.85;
        if (t > 0.7) s *= 1 - (t - 0.7) / 0.3;
        for (let j = 0; j <= radial; j++) {
          const idx = i * (radial + 1) + j;
          pos.setXYZ(idx, c.x + (pos.getX(idx) - c.x) * s, c.y + (pos.getY(idx) - c.y) * s * 0.68, c.z + (pos.getZ(idx) - c.z) * s);
        }
      }
      geo.computeVertexNormals();
      return new THREE.Mesh(geo, mat);
    }
    hairGroup.add(hairStrand([[-0.32, 0.9, 0.32], [-0.04, 0.74, 0.72], [0.38, 0.56, 0.78], [0.74, 0.28, 0.64], [0.98, 0.02, 0.4]], 0.26, 0.3, mats.hairLight));

        .to(live, { gx: 0.44, duration: 0.35 })
        .to(live, { ...resetGestures(), duration: 0.5, ease: 'power2.inOut' }),
      ult: () => gsap.timeline()
        .to(live, { ...resetGestures(), jy: -0.1, gx: 0.12, glaz: 0.3, graz: -0.3, llx: -0.35, lkx: 0.65, rlx: -0.35, rkx: 0.65, duration: 0.22, ease: 'power2.in' })
        .to(live, { jy: 0.36, gx: -0.14, gnx: -0.15, glaz: 2.05, graz: -2.05, glax: -0.4, grax: -0.4, llx: 0.15, lkx: 0.25, rlx: -0.25, rkx: 0.65, skirtFlare: 0.25, staffRotZ: 0.55, duration: 0.42, ease: 'back.out(1.6)' })
        .to(live, { jy: 0.3, glaz: 2.2, graz: -2.2, duration: 0.45, yoyo: true, repeat: 1, ease: 'sine.inOut' })
        .to(live, { ...resetGestures(), duration: 0.45, ease: 'power2.inOut' }),
      pride: () => gsap.timeline()
        .to(live, { ...resetGestures(), gx: -0.1, gz: 0.08, gnz: 0.12, gnx: -0.08, hipZ: -0.1, glaz: 0.65, glex: -0.85, glez: -0.45, graz: -0.65, grex: -0.85, grez: 0.45, duration: 0.35, ease: 'back.out(1.6)' })
        .to(live, { jy: 0.03, duration: 0.45, yoyo: true, repeat: 1 })
        .to(live, { ...resetGestures(), duration: 0.42, ease: 'power2.inOut' }),
      nod: () => gsap.timeline()
        .to(live, { gnx: 0.16, gx: 0.04, duration: 0.18, yoyo: true, repeat: 3, ease: 'sine.inOut' })
        .to(live, { ...resetGestures(), duration: 0.25 }),
      shrug: () => gsap.timeline()
        .to(live, { ...resetGestures(), gnz: -0.14, glaz: 0.95, glex: -0.75, glwz: 0.35, graz: -0.95, grex: -0.75, grwz: -0.35, jy: 0.04, duration: 0.32, ease: 'back.out(1.5)' })
        .to(live, { gnz: -0.16, duration: 0.35 })
        .to(live, { ...resetGestures(), duration: 0.4, ease: 'power2.inOut' })
    };
    GESTURES.cheer = GESTURES.arms_up;

    // Personaje activo (lo manda el servidor con cada respuesta): gestos permitidos y color del pelo.
    // Sin personaje (o sin gestos en la lista), todos los gestos están permitidos.
    let allowedGestures = null;
    const applyCharacter = (character) => {
      if (Array.isArray(character.gestures)) allowedGestures = new Set(character.gestures);
      // Aviso de licencia de Riot Games: el texto lo manda el servidor, tal cual, y solo se muestra si viene.
      const license = document.getElementById('lux-license');
      if (license) {
        license.textContent = typeof character.licenseNotice === 'string' ? character.licenseNotice : '';
        license.style.display = license.textContent ? 'block' : 'none';
      }
      if (typeof character.color === 'string' && /^#[0-9a-f]{6}$/i.test(character.color)) {
        const base = new THREE.Color(character.color);
        mats.hairMain.color.copy(base);
        mats.hairLight.color.copy(base).offsetHSL(0, 0, 0.08);
        mats.hairDeep.color.copy(base).offsetHSL(0, 0, -0.1);
      }
      // Avatar «glb:<id>»: el id lo decide el servidor (modelo elegido o propio). El overlay no tiene lista: solo valida el formato.
      const modelMatch = typeof character.avatar === 'string' ? /^glb:([a-z0-9-]{1,64})$/.exec(character.avatar) : null;
      if (modelMatch) mascotaShow(modelMatch[1]);
      else mascotaHide();
    };

    function playGesture(name) {
      if (reduceMotion || !GESTURES[name]) return;
      if (allowedGestures && !allowedGestures.has(name)) return;
      if (gestureTween) gestureTween.kill();
      gestureTween = GESTURES[name]();
      gestureTween.eventCallback('onUpdate', applyLivePose);
    }

    // ---------- 6. Expresiones y boca (texturas en caché) ----------
    const faceCache = {};
    const blinkCache = {};
    function setFace(expr, blink) {
      const cache = blink ? blinkCache : faceCache;
      if (!cache[expr.id]) {
        paintFace(expr, blink);
        const copy = document.createElement('canvas');
        copy.width = faceCanvas.width;
        copy.height = faceCanvas.height;
        copy.getContext('2d').drawImage(faceCanvas, 0, 0);
        cache[expr.id] = copy;
      }
      faceTexture.image = cache[expr.id];
      faceTexture.needsUpdate = true;
    }

    function applyExpression(index, instant) {
      const expr = EXPRESSIONS[index];
      setFace(expr, false);
      tweenPose(expr.pose, instant);
      const thumbs = Boolean(expr.pose.thumbsUp);
      leftArm.normalHand.visible = !thumbs;
      rightArm.normalHand.visible = !thumbs;
      leftArm.thumbsUp.visible = thumbs;
      rightArm.thumbsUp.visible = thumbs;
      staff.visible = Boolean(expr.pose.showStaff);
      stars.visible = Boolean(expr.pose.staffGlow || expr.starEyes);
    }

    let currentIndex = 0;
    const showExpression = (id) => {
      const i = IDS.indexOf(id);
      if (i >= 0) {
        currentIndex = i;
        applyExpression(i, false);
      }
    };
    // La boca cambia solo la textura: no mueve la pose ni reinicia tweens.
    const mouthTo = (id) => {
      const i = IDS.indexOf(id);
      if (i >= 0) setFace(EXPRESSIONS[i], false);
    };

    // ---------- 7. Cámara: encuadre que cabe entero ----------
    function frameCharacter() {
      applyLivePose();
      const box = new THREE.Box3().setFromObject(bodyPivot);
      if (box.isEmpty()) return;
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const halfTan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      const halfExtent = (Math.max(size.x, size.y) / 2) * 1.3;
      camera.position.set(0, center.y, halfExtent / halfTan);
      camera.lookAt(0, center.y, 0);
    }

    // ---------- 8. Tamaño de la fuente de OBS ----------
    const percent = Math.min(Math.max(Number(params.get('size')) || 40, 10), 100);
    Object.assign(canvas.style, { width: `${percent}vh`, height: `${percent}vh` });

    // ---------- 9. Bucle ----------
    // Mascota 2 (modelo GLB) y Lux no se dibujan a la vez: con la mascota activa, el bucle de Lux se detiene.
    let mascotaActive = false;
    let mascota = null;
    let mascotaId = null;      // id del modelo cargado o cargándose (el de su avatar glb:<id>)
    let mascotaWant = null;    // id del modelo que el servidor pide ahora
    let mascotaLoading = null; // promesa de la carga de mascotaId
    let mascotaFailed = null;  // { id, at }: el modelo que falló no se reintenta durante MASCOTA_RETRY_MS
    let luxLoopRunning = false;
    const clock = new THREE.Clock();
    let nextBlink = 3;
    let blinking = false;
    function loop() {
      if (mascotaActive) { luxLoopRunning = false; return; }
      luxLoopRunning = true;
      requestAnimationFrame(loop);
      breathT = clock.getElapsedTime();
      if (!gestureTween || !gestureTween.isActive()) applyLivePose();
      const current = EXPRESSIONS[currentIndex];
      if (breathT > nextBlink && !blinking && current.leftEye === 'open' && current.rightEye === 'open') {
        blinking = true;
        setFace(current, true);
        setTimeout(() => { setFace(current, false); blinking = false; }, 130);
        nextBlink = breathT + 2.8 + Math.random() * 2.6;
      }
      if (stars.visible) stars.children.forEach((s, i) => { s.rotation.y = breathT * 2.5 + i; });
      renderer.render(scene, camera);
    }

    // Arranque: encuadre, expresión normal y bucle
    showExpression('normal');
    applyExpression(0, true);
    frameCharacter();
    loop();
    if (params.get('demo')) setTimeout(() => playGesture(params.get('demo')), 400);

    // ---------- 9b. Mascota 2: modelo GLB del personaje (solo si el avatar es glb:<id>) ----------
    const mascotaCanvas = document.getElementById('mascota-c');
    // La URL lleva el id del modelo: así la caché del navegador guarda cada modelo por separado.
    const MASCOTA_RETRY_MS = 30000;
    const modelUrlFor = (modelId) => '/api/lux/mascota-model?k=' + encodeURIComponent(widgetKey) + '&m=' + encodeURIComponent(modelId);
    const fps60 = params.get('fps') === '60';
    // Destello de pantalla para el baile (A3). La vibración es del canvas de la mascota.
    const fxLayer = document.createElement('div');
    Object.assign(fxLayer.style, { position: 'fixed', inset: '0', pointerEvents: 'none', opacity: '0', background: 'radial-gradient(circle at 50% 60%, rgba(255,255,255,0.5), rgba(255,255,255,0) 60%)' });
    document.body.appendChild(fxLayer);
    const mascotaEffects = {
      shake() { if (typeof gsap !== 'undefined') gsap.fromTo(mascotaCanvas, { x: -8 }, { x: 0, duration: 0.45, ease: 'elastic.out(1, 0.3)' }); },
      flash() { if (typeof gsap !== 'undefined') gsap.fromTo(fxLayer, { opacity: 0.6 }, { opacity: 0, duration: 0.5, ease: 'power2.out' }); }
    };
    function mascotaLoad(modelId) {
      return import('/lux/mascota/mascota.js')
        .then((m) => m.createMascota({ canvas: mascotaCanvas, modelUrl: modelUrlFor(modelId), fps60, reduceMotion, effects: reduceMotion ? null : mascotaEffects }))
        .catch((err) => { console.warn('[Lux] Mascota 2 no se pudo cargar:', err && err.message); return null; });
    }
    // Pide el modelo «modelId». Si cambia el modelo, libera el anterior (dispose) y carga el nuevo; si falla, vuelve a Lux.
    function mascotaShow(modelId) {
      if (mascotaActive && mascotaWant === modelId) return;
      mascotaWant = modelId;
      const wasActive = mascotaActive;
      if (mascotaId !== modelId) {
        if (mascota) { mascota.dispose(); mascota = null; }
        const recentlyFailed = mascotaFailed !== null && mascotaFailed.id === modelId && Date.now() - mascotaFailed.at < MASCOTA_RETRY_MS;
        if (recentlyFailed) {
          mascotaId = null; // sin modelo cargado: el siguiente aviso lo vuelve a intentar cuando pase el plazo
          mascotaLoading = Promise.resolve(null);
        } else {
          mascotaId = modelId;
          mascotaLoading = mascotaLoad(modelId).then((api) => {
            if (mascotaId !== modelId) { if (api) api.dispose(); return null; } // ya se pidió otro modelo
            if (api) mascota = api;
            else { mascotaFailed = { id: modelId, at: Date.now() }; mascotaId = null; }
            return api;
          });
        }
      }
      if (!wasActive) {
        mascotaActive = true;
        canvas.style.display = 'none';
        Object.assign(mascotaCanvas.style, { width: `${percent}vh`, height: `${percent}vh`, transform: 'none' });
        if (typeof gsap !== 'undefined') gsap.set(mascotaCanvas, { xPercent: -50 });
      }
      mascotaLoading.then((api) => {
        if (!mascotaActive || mascotaWant !== modelId) return;
        if (api) api.enter();
        else mascotaHide(true);
      });
    }
    function mascotaHide(failed) {
      if (!mascotaActive) return;
      mascotaActive = false;
      const back = () => {
        if (mascotaActive) return;
        canvas.style.display = '';
        if (!luxLoopRunning) loop();
      };
      if (mascota && !failed) mascota.exit().then(back);
      else { mascotaCanvas.style.display = 'none'; back(); }
    }
    // Quién recibe cada cosa de la voz: la mascota si está activa, Lux si no.
    const actor = {
      on() { return mascotaActive && mascota !== null; },
      gesture(name) {
        if (!actor.on()) return playGesture(name);
        if (!allowedGestures || allowedGestures.has(name)) mascota.setGesture(name);
      },
      expression(id) { if (actor.on()) mascota.setEmotion(id); else showExpression(id); },
      speaking(on) { if (actor.on()) mascota.setSpeaking(on); },
      mouth(level) { if (actor.on()) mascota.setMouth(level); }
    };

    // ---------- 10. Voz: cola, audio, boca y gesto al empezar ----------
    let audioContext = null;
    let queue = Promise.resolve();
    const ensureContext = () => {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      return audioContext;
    };

    async function synthesize(text, voice) {
      const body = { text, k: widgetKey || undefined };
      if (voice && voice.referenceId) body.reference_id = voice.referenceId;
      if (voice && voice.engine) body.engine = voice.engine;
      const res = await fetch('/api/tts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!res.ok) throw new Error('tts ' + res.status);
      return res.blob();
    }

    function lipSync(audio, analyser, emotion) {
      const data = new Uint8Array(analyser.fftSize);
      let open = false;
      let last = 0;
      const tick = (now) => {
        if (audio.paused || audio.ended) return;
        analyser.getByteTimeDomainData(data);
        let sum = 0;
        for (let i = 0; i < data.length; i++) {
          const s = (data[i] - 128) / 128;
          sum += s * s;
        }
        const level = Math.sqrt(sum / data.length);
        actor.mouth(level);
        const isOpen = level > 0.04;
        if (isOpen !== open && now - last > 110) {
          open = isOpen;
          last = now;
          mouthTo(open ? 'habla' : emotion);
        }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }

    async function playOne(text, emotion, voice, gesture) {
      actor.gesture(gesture);
      actor.expression(emotion);
      let blob;
      try {
        blob = await synthesize(text, voice);
      } catch {
        try {
          blob = await synthesize(text, {});
        } catch {
          actor.expression('normal');
          return;
        }
      }
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      audio.volume = Math.min(1, Math.max(0, (typeof window.luxVolume === 'number' ? window.luxVolume : 100) / 100));
      const context = ensureContext();
      if (context.state === 'running') {
        try {
          const source = context.createMediaElementSource(audio);
          const analyser = context.createAnalyser();
          analyser.fftSize = 512;
          source.connect(analyser);
          analyser.connect(context.destination);
          audio.addEventListener('play', () => lipSync(audio, analyser, emotion));
        } catch {
          // Sin analizador, la voz suena igual con la expresión de la emoción.
        }
      }
      actor.speaking(true);
      await new Promise((resolve) => {
        audio.addEventListener('ended', resolve, { once: true });
        audio.addEventListener('error', resolve, { once: true });
        audio.play().catch((err) => {
          console.warn('[Lux] El navegador bloqueó el audio:', err && err.name);
          resolve();
        });
      });
      actor.speaking(false);
      URL.revokeObjectURL(url);
      actor.expression('normal');
    }

    // playAfter: hora ISO a partir de la que puede sonar (las respuestas a comandos esperan 5 s).
    const speak = (text, emotion, voice, gesture, playAfter) => {
      const clean = String(text || '').trim().slice(0, 500);
      if (!clean) return;
      const mood = IDS.includes(emotion) ? emotion : 'normal';
      const readyAt = (playAfter && Date.parse(playAfter)) || Date.now();
      queue = queue
        .then(async () => {
          const wait = readyAt - Date.now();
          if (wait > 0) await new Promise((r) => setTimeout(r, wait));
          // Si la frase lleva más de 20 s esperando a que le toque, se descarta.
          if (Date.now() - readyAt > 20000) return null;
          return playOne(clean, mood, voice || {}, gesture);
        })
        .catch(() => actor.expression('normal'));
    };
    window.luxSpeak = speak;
    window.luxGesture = playGesture;

    if (typeof BroadcastChannel !== 'undefined') {
      const bus = new BroadcastChannel('lux_bus');
      bus.onmessage = (event) => {
        const d = event.data;
        if (!d) return;
        if (d.type === 'speak') speak(d.text, d.emotion, d.voice, d.gesture);
        if (d.type === 'gesture') actor.gesture(d.name);
      };
    }

    // ---------- 11. Lo que llega del servidor (frases, voz, volumen) ----------
    let after = null;
    const poll = async () => {
      if (!widgetKey) return;
      try {
        const url = '/api/lux/speech?k=' + encodeURIComponent(widgetKey) + (after === null ? '' : '&after=' + after);
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) return;
        const data = await res.json();
        if (data.character) applyCharacter(data.character);
        if (after !== null) for (const item of data.items || []) speak(item.text, item.emotion, item.voice, item.gesture, item.playAfter);
        after = data.last;
        if (data.tts) window.luxTts = data.tts;
        if (typeof data.volume === 'number') window.luxVolume = data.volume;
      } catch {
        // Sin conexión, se reintenta en el siguiente ciclo.
      }
    };
    if (widgetKey) {
      poll();
      setInterval(poll, 1500);
    }

    // Actualizaciones: se recarga sola cuando el administrador publica una versión nueva.
    let knownRelease = null;
    const checkRelease = async () => {
      try {
        const res = await fetch('/api/lux/release', { cache: 'no-store' });
        if (!res.ok) return;
        const data = await res.json();
        if (knownRelease === null) knownRelease = data.version;
        else if (data.version !== knownRelease) location.reload();
      } catch {
        // Sin conexión no se recarga.
      }
    };
    checkRelease();
    setInterval(checkRelease, 60000);

    // ---------- 12. Chat de Twitch (lectura anónima): !s, !lux y !luxon/!luxoff ----------
    const channel = (params.get('channel') || '').replace(/^#/, '').toLowerCase();
    if (widgetKey && channel && typeof WebSocket !== 'undefined') {
      const parseTags = (raw) => {
        const out = {};
        raw.split(';').forEach((pair) => {
          const at = pair.indexOf('=');
          if (at > 0) out[pair.slice(0, at)] = pair.slice(at + 1);
        });
        return out;
      };
      const privileged = (tags) => tags.mod === '1' || /broadcaster|moderator/.test(tags.badges || '');
      const post = (body) => fetch('/api/lux/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({ k: widgetKey }, body))
      }).catch(() => undefined);

      const onChat = (user, text, tags) => {
        if (text.startsWith('!s ')) {
          const spoken = text.slice(3).trim();
          if (spoken) speak(user + ' dice: ' + spoken, 'normal', window.luxTts || {}, 'idle');
          return;
        }
        if (text === '!lux' || text.startsWith('!lux ')) {
          const message = text.slice(4).trim();
          if (message) post({ command: 'ask', viewer: user, message });
          return;
        }
        if ((text === '!luxon' || text === '!luxoff') && privileged(tags)) {
          post({ command: text === '!luxon' ? 'on' : 'off', privileged: true });
        }
      };

      const connect = () => {
        const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
        ws.onopen = () => {
          ws.send('CAP REQ :twitch.tv/tags');
          ws.send('PASS SCHMOOPIIE');
          ws.send('NICK justinfan' + Math.floor(10000 + Math.random() * 80000));
          ws.send('JOIN #' + channel);
        };
        ws.onmessage = (event) => {
          String(event.data).split('\r\n').forEach((line) => {
            if (line.startsWith('PING')) { ws.send('PONG' + line.slice(4)); return; }
            const m = /^(?:@(\S+) )?:([^!]+)![^ ]+ PRIVMSG #\S+ :(.*)$/.exec(line);
            if (!m) return;
            const tags = parseTags(m[1] || '');
            onChat(tags['display-name'] || m[2], m[3].trim(), tags);
          });
        };
        ws.onclose = () => setTimeout(connect, 5000);
        ws.onerror = () => ws.close();
      };
      connect();
    }
  </script>
</body>
</html>
